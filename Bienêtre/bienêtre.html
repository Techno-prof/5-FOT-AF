<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bien-être</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Écran 1 : fond noir + bouton lecture */
  #accueil {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #btnPlay {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
  }
  #btnPlay:hover { transform: scale(1.1); background: rgba(255,255,255,.15); }
  #btnPlay::before {
    content: "";
    margin-left: 10px;
    border-style: solid;
    border-width: 25px 0 25px 42px;
    border-color: transparent transparent transparent #fff;
  }

  /* Écran 2 : lecteur vidéo */
  #lecteur {
    position: fixed; inset: 0;
    background: #000;
    display: none;
  }
  #lecteur video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Écran 3 : affiche finale */
  #affiche {
    position: fixed; inset: 0;
    background: url("affiche.png") center / cover no-repeat #000;
    display: none;
  }
  #btnRejouer {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    font-size: 18px;
    border: 2px solid #fff;
    background: rgba(0,0,0,.6);
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
  }
  #btnRejouer:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<div id="accueil">
  <button id="btnPlay" aria-label="Lancer la vidéo"></button>
</div>

<div id="lecteur">
  <video id="video" src="Video.mp4" controls playsinline preload="auto"></video>
</div>

<div id="affiche">
  <button id="btnRejouer">↻ Rejouer</button>
</div>

<script>
  const accueil = document.getElementById("accueil");
  const lecteur = document.getElementById("lecteur");
  const affiche = document.getElementById("affiche");
  const video   = document.getElementById("video");

  function lancer() {
    accueil.style.display = "none";
    affiche.style.display = "none";
    lecteur.style.display = "block";
    video.currentTime = 0;
    video.play();
  }

  function terminer() {
    lecteur.style.display = "none";
    affiche.style.display = "block";
  }

  // Déclenché automatiquement à la fin réelle de la vidéo
  video.addEventListener("ended", terminer);

  document.getElementById("btnPlay").addEventListener("click", lancer);
  document.getElementById("btnRejouer").addEventListener("click", lancer);
</script>

</body>
</html>
