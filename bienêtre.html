<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bien-être</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Écran 1 : fond noir + bouton lecture */
  #accueil {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #btnPlay {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
  }
  #btnPlay:hover { transform: scale(1.1); background: rgba(255,255,255,.15); }
  #btnPlay::before {
    content: "";
    margin-left: 10px;
    border-style: solid;
    border-width: 25px 0 25px 42px;
    border-color: transparent transparent transparent #fff;
  }

  /* Écran 2 : lecteur vidéo */
  #lecteur {
    position: fixed; inset: 0;
    background: #000;
    display: none;
  }
  #lecteur iframe { width: 100%; height: 100%; border: 0; }

  /* Écran 3 : affiche finale */
  #affiche {
    position: fixed; inset: 0;
    background: url("affiche.png") center / cover no-repeat #000;
    display: none;
  }
  #btnRejouer {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    font-size: 18px;
    border: 2px solid #fff;
    background: rgba(0,0,0,.6);
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
  }
  #btnRejouer:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<div id="accueil">
  <button id="btnPlay" aria-label="Lancer la vidéo"></button>
</div>

<div id="lecteur"><div id="player"></div></div>

<div id="affiche">
  <button id="btnRejouer">↻ Rejouer</button>
</div>

<script>
  const VIDEO_ID = "COLLER_ICI_ID_YOUTUBE";

  const accueil = document.getElementById("accueil");
  const lecteur = document.getElementById("lecteur");
  const affiche = document.getElementById("affiche");
  let player = null;

  // Chargement de l'API YouTube
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  let apiPrete = false;
  window.onYouTubeIframeAPIReady = function () { apiPrete = true; };

  function lancer() {
    accueil.style.display = "none";
    affiche.style.display = "none";
    lecteur.style.display = "block";

    if (player) {
      player.seekTo(0);
      player.playVideo();
      return;
    }

    if (!apiPrete) {
      // L'API n'est pas encore chargée : on réessaie dans un instant
      setTimeout(lancer, 300);
      return;
    }

    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 1,
        rel: 0,          // pas de vidéos suggérées à la fin
        modestbranding: 1,
        playsinline: 1
      },
      events: {
        onStateChange: function (e) {
          // 0 = vidéo terminée
          if (e.data === YT.PlayerState.ENDED) {
            terminer();
          }
        }
      }
    });
  }

  function terminer() {
    lecteur.style.display = "none";
    affiche.style.display = "block";
  }

  document.getElementById("btnPlay").addEventListener("click", lancer);
  document.getElementById("btnRejouer").addEventListener("click", lancer);
</script>

</body>
</html>
