<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiche</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }

  /* Affiche en fond */
  .affiche {
    position: fixed; inset: 0;
    background: url("affiche.png") center / cover no-repeat;
  }

  /* Boutons */
  .btn {
    position: fixed; left: 50%; bottom: 8%;
    transform: translateX(-50%);
    padding: 16px 36px; font-size: 1.2rem; font-weight: bold;
    color: #fff; background: rgba(0,0,0,.65);
    border: 2px solid #fff; border-radius: 50px;
    cursor: pointer; transition: .2s; z-index: 5;
  }
  .btn:hover { background: #fff; color: #000; }

  /* Calque vidéo */
  .video-layer {
    position: fixed; inset: 0; background: #000;
    display: none; z-index: 10;
  }
  .video-layer iframe { width: 100%; height: 100%; border: 0; }

  /* Bouton retour, placé en haut à gauche (évite les commandes Drive) */
  .btn-retour {
    position: fixed; top: 16px; left: 16px;
    padding: 10px 20px; font-size: 1rem;
    color: #fff; background: rgba(0,0,0,.75);
    border: 2px solid #fff; border-radius: 30px;
    cursor: pointer; z-index: 20; display: none;
  }
  .btn-retour:hover { background: #fff; color: #000; }
</style>
</head>
<body>

  <!-- Affiche + bouton lancer / rejouer -->
  <div class="affiche"></div>
  <button class="btn" id="btnPlay">▶ Lancer la vidéo</button>

  <!-- Vidéo Google Drive -->
  <div class="video-layer" id="videoLayer">
    <iframe id="driveFrame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <button class="btn-retour" id="btnRetour">⏹ Retour à l'affiche</button>

<script>
  const VIDEO_URL = "https://drive.google.com/file/d/1_RmCkdx-uwwL1KjmvmTii7NE4SxIpIV8/view?usp=drive_link";

  const btnPlay = document.getElementById("btnPlay");
  const btnRetour = document.getElementById("btnRetour");
  const layer = document.getElementById("videoLayer");
  const frame = document.getElementById("driveFrame");

  btnPlay.addEventListener("click", () => {
    frame.src = VIDEO_URL;          // charge la vidéo
    layer.style.display = "block";
    btnRetour.style.display = "block";
    btnPlay.style.display = "none";
  });

  btnRetour.addEventListener("click", () => {
    frame.src = "";                 // arrête la vidéo
    layer.style.display = "none";
    btnRetour.style.display = "none";
    btnPlay.textContent = "↻ Rejouer";
    btnPlay.style.display = "block";
  });
</script>
</body>
</html>
